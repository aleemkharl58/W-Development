<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display properties</title>
    <style>
        div{
            background-color: rgba(255,0,0,0.5);
            display: inline-block;
            height: 100px;
            width: 100px;
            margin: 25px;
            padding: 25px;
        }
        button{
            background-color: aquamarine;
            display: none;
        }
        #sec{
            background-color: goldenrod;
            visibility: hidden;
        }
        #trd{
            background-color:rgba(255,0,0,1);
            /* here a is the opacity with rgb which shows the intensity of color and it is always between 0 to 1 [ intensity is highest at 1 and lowest at 0 ]*/
        }
    </style>
</head>
<body>
    <div id="fr">this is div</div>
    <button>click me</button>
    <div id="sec">this is 2nd div</div>
    <div id="trd">this is 3rd div</div>
</body>
</html>
